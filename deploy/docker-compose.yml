# n8n 內部自架堆疊：Caddy (自動 TLS) + n8n + PostgreSQL
#
# 使用方式：
#   cp .env.example .env && vi .env
#   ./scripts/gen-secrets.sh
#   docker compose up -d
#
# 版本升級時，只需修改 N8N_VERSION 後 docker compose pull && docker compose up -d

name: n8n

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?請在 .env 設定 POSTGRES_DB}
      # n8n 需要 UTF8；用 C locale 讓排序行為穩定可預期
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal
    # 刻意不對外開 port：只有 n8n 容器能連到資料庫

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.42.2}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ---- 對外網址（Caddy 轉發用，必須與實際網域一致）----
      N8N_HOST: ${N8N_DOMAIN:?請在 .env 設定 N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:?請在 .env 設定 N8N_DOMAIN}
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN:?請在 .env 設定 N8N_DOMAIN}
      # 前面有 1 層反向代理（Caddy），讓 n8n 正確取得來源 IP
      N8N_PROXY_HOPS: 1
      # 走 HTTPS，cookie 一定要加上 Secure
      N8N_SECURE_COOKIE: 'true'

      # ---- 資料庫 ----
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public

      # ---- 加密金鑰（弄丟就解不開所有已存的憑證，務必備份）----
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'

      # ---- 時區 ----
      GENERIC_TIMEZONE: ${TZ:-Asia/Taipei}
      TZ: ${TZ:-Asia/Taipei}

      # ---- 執行紀錄保存策略（避免資料庫無限膨脹）----
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-20000}
      N8N_RUNNERS_TASK_TIMEOUT: 300

      # ---- 安全 / 隱私 ----
      # v2 預設即禁止節點讀取 process.env，這裡明示以免被誤改
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_HIRING_BANNER_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: ${N8N_COMMUNITY_PACKAGES_ENABLED:-true}
      # Read/Write Files 節點只能存取這個目錄（預設僅 ~/.n8n-files）
      N8N_RESTRICT_FILE_ACCESS_TO: /files

      # ---- Log ----
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: console

      # ---- Email / SMTP（邀請使用者、密碼重設通知用；不填則停用）----
      N8N_EMAIL_MODE: ${N8N_EMAIL_MODE:-}
      N8N_SMTP_HOST: ${N8N_SMTP_HOST:-}
      N8N_SMTP_PORT: ${N8N_SMTP_PORT:-587}
      N8N_SMTP_USER: ${N8N_SMTP_USER:-}
      N8N_SMTP_PASS: ${N8N_SMTP_PASS:-}
      N8N_SMTP_SENDER: ${N8N_SMTP_SENDER:-}
      N8N_SMTP_SSL: ${N8N_SMTP_SSL:-false}
      N8N_SMTP_STARTTLS: ${N8N_SMTP_STARTTLS:-true}

      # ---- Enterprise 授權（選用，留空即為社群版）----
      N8N_LICENSE_ACTIVATION_KEY: ${N8N_LICENSE_ACTIVATION_KEY:-}
    volumes:
      - n8n-data:/home/node/.n8n
      # Read/Write Files 節點可存取的目錄（不要指向主機敏感路徑）
      - ./local-files:/files
    secrets:
      - n8n_encryption_key
    networks:
      - internal
      - edge
    healthcheck:
      # readiness 端點在 n8n 完成初始化後才會回 200
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - '80:80'
      - '443:443'
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:?請在 .env 設定 N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 公司 *.skycloud.tw 萬用憑證（fullchain.pem + privkey.pem）
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

volumes:
  n8n-data:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key

networks:
  # 對外層：只有 Caddy 與 n8n 相連
  edge:
  # 內部層：資料庫只在此層，無對外路由
  internal:
    internal: true
